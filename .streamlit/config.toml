[theme]
base = "light"
primaryColor = "#B5885C"
backgroundColor = "#F9F6F0"
secondaryBackgroundColor = "#F4EBE1"
textColor = "#1C1512"
borderColor = "#A87B4C"
linkColor = "#8C5828"
font = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "'Bodoni Moda':https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "8px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.sidebar]
backgroundColor = "#3D2619"
secondaryBackgroundColor = "#5C3C28"
textColor = "#FFFFFF"
primaryColor = "#B5885C"
borderColor = "#A87B4C"

[client]
toolbarMode = "minimal"

[server]
headless = true
