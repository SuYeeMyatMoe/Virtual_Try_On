[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#131313"
secondaryBackgroundColor = "#20201F"
textColor = "#E5E2E1"
borderColor = "#494454"
linkColor = "#D0BCFF"
font = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "'Bodoni Moda':https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "8px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
redColor = "#FFB4AB"
orangeColor = "#F59E0B"
greenColor = "#10B981"
violetColor = "#8B5CF6"
grayColor = "#958EA0"

[theme.sidebar]
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#1C1B1B"
textColor = "#E5E2E1"
primaryColor = "#8B5CF6"
borderColor = "#494454"

[client]
toolbarMode = "minimal"

[server]
headless = true
